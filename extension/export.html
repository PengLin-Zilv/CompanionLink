<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkLab Replika Exporter</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }

      body {
        margin: 0;
        width: 320px;
        background: #f7f8fa;
        color: #171a1f;
      }

      main {
        padding: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 700;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 700;
      }

      .hint {
        margin: 6px 0 0;
        color: #586170;
        font-size: 12px;
        line-height: 1.35;
      }

      .hint + label {
        margin-top: 12px;
      }

      input + label {
        margin-top: 12px;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        height: 36px;
        border: 1px solid #aeb6c2;
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
        background: white;
      }

      button {
        width: 100%;
        height: 38px;
        margin-top: 12px;
        border: 0;
        border-radius: 6px;
        background: #1769e0;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        background: #8aaee8;
        cursor: default;
      }

      #status,
      #progress {
        min-height: 20px;
        margin: 10px 0 0;
        line-height: 1.4;
      }

      #status[data-tone="error"] {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Replika Export</h1>
      <form id="export-form">
        <label for="participant-id">Participant ID (PID)</label>
        <input id="participant-id" name="participant-id" autocomplete="off" placeholder="Example: 040" aria-describedby="pid-hint" required>
        <p id="pid-hint" class="hint">Enter the participant PID, for example 040. The file will download as P040.csv.</p>
        <label for="from-date">From date</label>
        <input id="from-date" name="from-date" type="date" aria-describedby="date-range-hint" required>
        <label for="to-date">To date</label>
        <input id="to-date" name="to-date" type="date" aria-describedby="date-range-hint" required>
        <p id="date-range-hint" class="hint">Both dates are included. If To date is today, messages through export time are included.</p>
        <button id="export-button" type="submit">Export CSV</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="progress" aria-live="polite"></p>
    </main>
    <script type="module" src="export.js"></script>
  </body>
</html>
